<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Tommy's Big Universe</title>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://www.amazon.com/dp/B0HNDVYKM7">
  </noscript>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff8ee;
      color: #3b2a1a;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
    }
    main { text-align: center; padding: 2rem; max-width: 28rem; }
    h1 { font-size: 1.7rem; font-weight: normal; margin: 0 0 1rem; }
    a { color: #8a3b12; }
  </style>
</head>
<body>
  <main>
    <h1>Little Tommy's Big Universe</h1>
    <p><a href="https://www.amazon.com/dp/B0HNDVYKM7">Continue to Tommy's books on Amazon</a></p>
  </main>
  <script>
    (function () {
      var destination = "https://www.amazon.com/dp/B0HNDVYKM7";
      var pageUrl = "https://mandmbchillin-tech.github.io/go/";
      var pixel = "https://hitscounter.dev/api/hit?url=" + encodeURIComponent(pageUrl) + "&label=LTBU";
      var left = false;
      function go() {
        if (left) return;
        left = true;
        location.replace(destination);
      }
      var img = new Image();
      img.onload = go;
      img.onerror = go;
      img.src = pixel;
      setTimeout(go, 400);
    })();
  </script>
</body>
</html>
